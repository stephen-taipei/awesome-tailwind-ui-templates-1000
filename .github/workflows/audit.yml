name: Codebase audit
on:
  push:
    branches: [audit/codebase-remediation-20260924]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Capture dependency audit
        run: npm audit --json > /tmp/npm-audit.json || true
      - name: Package verification dependencies
        run: tar -czf /tmp/audit-dependencies.tar.gz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: audit-dependencies
          path: |
            /tmp/audit-dependencies.tar.gz
            /tmp/npm-audit.json
          retention-days: 1
          if-no-files-found: error
