name: Codebase audit
on:
  push:
    branches: [audit/codebase-remediation-20260924]
permissions:
  contents: write
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  remediation:
    if: github.ref == 'refs/heads/audit/codebase-remediation-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Apply reviewed responsive fixes
        run: |
          python3 scripts/migrate_legacy.py --apply
          python3 scripts/responsive.py --apply
      - run: npm run build
      - run: npm test
      - run: npm run audit
      - name: Commit generated migration on the isolated audit branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- templates cards forms lists assets catalog.html templates.json sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix: reflow narrow layouts and preserve scrollable calendar examples'
            git push origin HEAD:audit/codebase-remediation-20260924
          fi
      - run: npm audit --json > audit-results/npm-audit.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Capture source and verification identity
        if: always()
        run: |
          git rev-parse HEAD > /tmp/audit-head.txt
          git archive --format=tar HEAD | gzip > /tmp/audit-reviewed-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codebase-audit-evidence
          path: |
            audit-results/
            playwright-report/
            test-results/
            /tmp/audit-head.txt
            /tmp/audit-reviewed-source.tar.gz
          retention-days: 7
          if-no-files-found: error
